name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Buscar secretos en todo el historial
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --no-banner --redact --config /repo/.gitleaks.toml --exit-code 1

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema==0.29.4
      - name: Cada contrato es un JSON Schema valido
        run: |
          shopt -s nullglob
          files=(contracts/*.schema.json)
          if [ ${#files[@]} -eq 0 ]; then echo "sin contratos aun"; exit 0; fi
          check-jsonschema --check-metaschema "${files[@]}"
      - name: Cada ejemplo cumple su contrato (contracts/examples/<nombre>/*.json)
        run: |
          shopt -s nullglob
          rc=0
          for dir in contracts/examples/*/; do
            name=$(basename "$dir")
            schema="contracts/$name.schema.json"
            if [ ! -f "$schema" ]; then echo "::error::$dir no tiene $schema"; rc=1; continue; fi
            ex=("$dir"*.json)
            [ ${#ex[@]} -eq 0 ] && continue
            check-jsonschema --schemafile "$schema" "${ex[@]}" || rc=1
          done
          exit $rc

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.7.4 pytest==8.3.3
      - name: Lint
        run: |
          shopt -s nullglob globstar
          files=(aws/**/*.py simulator/**/*.py scripts/**/*.py gcp/insights/**/*.py)
          if [ ${#files[@]} -eq 0 ]; then echo "sin python aun"; exit 0; fi
          ruff check "${files[@]}"
      - name: Tests
        run: |
          dirs=$(find aws simulator gcp/insights scripts -type d -name tests 2>/dev/null || true)
          if [ -z "$dirs" ]; then echo "sin tests aun"; exit 0; fi
          for d in $dirs; do
            req="$(dirname "$d")/requirements.txt"; [ -f "$req" ] && pip install -r "$req"
            dev="$(dirname "$d")/requirements-dev.txt"; [ -f "$dev" ] && pip install -r "$dev"
          done
          pytest -q $dirs

  serverless-package:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      # `serverless package` resuelve ${aws:accountId} y ${ssm:...}, que en Serverless v3 exigen credenciales AWS
      # aunque no se despliegue nada. Mismos secrets que deploy-aws.yml; sin ellos el job se salta.
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      SLS_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Hay serverless-compose.yml y credenciales
        id: has
        run: |
          yes=true
          if [ ! -f aws/serverless-compose.yml ]; then echo "::notice::sin serverless aun"; yes=false; fi
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SESSION_TOKEN" ]; then echo "::notice::Sin credenciales del Learner Lab en secrets (fork o sesion caducada); se salta el empaquetado"; yes=false; fi
          echo "yes=$yes" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.has.outputs.yes == 'true'
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        if: steps.has.outputs.yes == 'true'
        with:
          python-version: "3.12"
      - name: Construir la layer fp-shared
        if: steps.has.outputs.yes == 'true'
        run: |
          python -m pip install pyyaml
          bash aws/shared/build.sh
      - name: Compose instalado (Framework 3 + @serverless/compose fijados en aws/package.json)
        if: steps.has.outputs.yes == 'true'
        working-directory: aws
        run: |
          npm ci
          npx serverless --version
          test -f node_modules/@serverless/compose/package.json
      - name: Empaquetar cada servicio (compose no soporta package)
        if: steps.has.outputs.yes == 'true'
        run: |
          failed=0
          for d in aws/shared aws/ingest aws/integrations/outbox-publisher aws/scoring aws/incidents aws/registry aws/integrations/gcp-exporter aws/planning simulator; do
            echo "::group::package $d"
            (cd "$d" && npx -y serverless@3 package --stage ci) || { echo "::error::package failed in $d"; failed=1; }
            echo "::endgroup::"
          done
          exit $failed

  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [gcp/terraform]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Validate ${{ matrix.dir }}
        run: |
          shopt -s nullglob
          files=(${{ matrix.dir }}/*.tf)
          if [ ${#files[@]} -eq 0 ]; then echo "sin terraform aun en ${{ matrix.dir }}"; exit 0; fi
          terraform -chdir=${{ matrix.dir }} init -backend=false -input=false
          terraform -chdir=${{ matrix.dir }} validate
