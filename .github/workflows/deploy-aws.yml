name: deploy-aws

on:
  push:
    branches: [main]
    paths: ["aws/**", "simulator/**", "aws/shared/**", "contracts/**", ".github/workflows/deploy-aws.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      # Credenciales de sesion del Learner Lab. Caducan: Benjamin las renueva con scripts/lab-creds.sh --gh
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Hay credenciales y hay que desplegar
        id: go
        run: |
          ok=true
          if [ ! -f aws/serverless-compose.yml ]; then echo "::notice::aws/serverless-compose.yml no existe todavia; nada que desplegar"; ok=false; fi
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SESSION_TOKEN" ]; then echo "::warning::Sin credenciales del Learner Lab en los secrets del repo. Correr scripts/lab-creds.sh --gh"; ok=false; fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.go.outputs.ok == 'true'
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        if: steps.go.outputs.ok == 'true'
        with:
          python-version: "3.12"
      - name: Construir la layer fp-shared
        if: steps.go.outputs.ok == 'true'
        run: |
          python -m pip install pyyaml
          bash aws/shared/build.sh
      - name: Verificar credenciales
        if: steps.go.outputs.ok == 'true'
        run: aws sts get-caller-identity
      - name: Deploy
        if: steps.go.outputs.ok == 'true'
        working-directory: aws
        run: |
          npm ci
          npx serverless deploy --stage dev --region "$AWS_REGION" --verbose
