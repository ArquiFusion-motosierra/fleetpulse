name: deploy-aws

on:
  push:
    branches: [main]
    paths: ["aws/**", "contracts/**", ".github/workflows/deploy-aws.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      # Credenciales de sesion del Learner Lab. Caducan: renovar con scripts/lab-creds.sh --gh
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verificar credenciales
        run: aws sts get-caller-identity
      - name: Instalar Serverless Framework
        run: npm install -g serverless@3
      - name: Deploy
        working-directory: aws
        run: |
          if [ -f package.json ]; then npm ci; fi
          sls deploy --stage dev --region "$AWS_REGION" --verbose
