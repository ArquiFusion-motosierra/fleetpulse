# Stack fp-incidents: maquina de estados Standard incident-flow (T09 + T14), sus Lambdas y las rutas
# /approvals/{token+} y /incidents/{incident_id}/close en la HTTP API fp-api de fp-core (provider.httpApi.id).
# La inicia `score` (aws/scoring) con nombre = incident_id. Tablas, topics, la API y /fleetpulse/api/url los crea
# fp-core (aws/ingest); el secreto fleetpulse/gcp/sa-invoker lo carga Fabricio (contracts/secrets.md).
service: fp-incidents
frameworkVersion: "3"

provider:
  name: aws
  runtime: python3.12
  architecture: arm64
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 30
  logRetentionInDays: 14
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  layers:
    - ${ssm:/fleetpulse/layers/shared, 'arn:aws:lambda:us-east-1:000000000000:layer:fp-shared:1'}
  httpApi:
    id: ${cf:fp-core-${sls:stage}.HttpApiId, 'offline-default-id'}
  environment:
    STATE_TABLE: fp-state
    REGISTRY_TABLE: fp-registry
    OUTBOX_TABLE: fp-outbox

package:
  patterns:
    - "!**"
    - "flow/**"
    - "api/**"
    - "lib/**"
    - "!**/__pycache__/**"

functions:
  classify:
    handler: flow/classify.handler
  checkExisting:
    handler: flow/check_existing.handler
  correlateZone:
    handler: flow/correlate_zone.handler
  createIncident:
    handler: flow/create_incident.handler
  explainCause:
    handler: flow/explain_cause.handler
    timeout: 15  # token 3 s + /explain 8 s; la plantilla cubre cualquier falla
    environment:
      INVOKER_SECRET: fleetpulse/gcp/sa-invoker
  rankTechnicians:
    handler: flow/rank_technicians.handler
  waitForApproval:
    handler: flow/wait_for_approval.handler
    timeout: 15
    environment:
      NOTIFY_TOPIC_ARN: arn:aws:sns:${aws:region}:${aws:accountId}:fp-notify
      API_URL_PARAM: /fleetpulse/api/url
  renderMessages:
    handler: flow/render_messages.handler
  assignTechnician:
    handler: flow/assign_technician.handler
  reserveParts:
    handler: flow/reserve_parts.handler
  approvals:
    handler: api/approvals.handler
    timeout: 10
    events:
      # greedy: el task token trae "/" (%2F en el enlace del correo). GET solo muestra la confirmacion (los
      # escaneres de correo abren los enlaces); el boton "Aprobar" hace POST y solo el POST reanuda la ejecucion.
      - httpApi: GET /approvals/{token+}
      - httpApi: POST /approvals/{token+}
  close:
    handler: api/close.handler
    timeout: 10
    environment:
      EXECUTION_ARN_PREFIX: arn:aws:states:${aws:region}:${aws:accountId}:execution:incident-flow
    events:
      - httpApi: POST /incidents/{incident_id}/close

resources:
  Resources:
    IncidentFlowLogs:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /aws/states/incident-flow
        RetentionInDays: 14

    IncidentFlow:
      Type: AWS::StepFunctions::StateMachine
      Properties:
        StateMachineName: incident-flow
        StateMachineType: STANDARD
        RoleArn: arn:aws:iam::${aws:accountId}:role/LabRole
        Definition: ${file(statemachine/incident-flow.asl.json)}
        DefinitionSubstitutions:
          ClassifyArn: !GetAtt ClassifyLambdaFunction.Arn
          CheckExistingArn: !GetAtt CheckExistingLambdaFunction.Arn
          CorrelateZoneArn: !GetAtt CorrelateZoneLambdaFunction.Arn
          CreateIncidentArn: !GetAtt CreateIncidentLambdaFunction.Arn
          ExplainCauseArn: !GetAtt ExplainCauseLambdaFunction.Arn
          RankTechniciansArn: !GetAtt RankTechniciansLambdaFunction.Arn
          WaitForApprovalArn: !GetAtt WaitForApprovalLambdaFunction.Arn
          RenderMessagesArn: !GetAtt RenderMessagesLambdaFunction.Arn
          AssignTechnicianArn: !GetAtt AssignTechnicianLambdaFunction.Arn
          ReservePartsArn: !GetAtt ReservePartsLambdaFunction.Arn
          NotifyTopicArn: arn:aws:sns:${aws:region}:${aws:accountId}:fp-notify
          AlertsTopicArn: arn:aws:sns:${aws:region}:${aws:accountId}:fp-alerts
        LoggingConfiguration:
          Level: ALL
          IncludeExecutionData: true
          Destinations:
            - CloudWatchLogsLogGroup:
                LogGroupArn: !GetAtt IncidentFlowLogs.Arn

  Outputs:
    IncidentFlowArn:
      Value: !Ref IncidentFlow
      Export: {Name: "${self:service}-IncidentFlowArn"}
