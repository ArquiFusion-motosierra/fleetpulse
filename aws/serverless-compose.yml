# Orden de despliegue de AWS (Serverless Framework 3 compose). Correr `bash aws/shared/build.sh` antes.
# oci-writer NO esta aqui a proposito: plan B sin OCI.
services:
  shared:
    path: shared

  auth:
    path: auth

  core:
    path: ingest
    dependsOn: [shared, auth]

  outbox-publisher:
    path: integrations/outbox-publisher
    dependsOn: [shared, core]

  registry:
    path: registry
    dependsOn: [shared, core]

  gcp-exporter:
    path: integrations/gcp-exporter
    dependsOn: [shared, core]

  incidents:
    path: incidents
    dependsOn: [shared, core]

  scoring:
    path: scoring
    dependsOn: [core, incidents]

  reports:
    path: reports
    dependsOn: [shared, core, auth, incidents]

  # Incremento 1 (T18): la regla diaria queda DISABLED; scripts/planning.sh run|on|off|status
  planning:
    path: planning
    dependsOn: [shared, core]

  simulator:
    path: ../simulator
    dependsOn: [core]
    params:
      enabled: false
