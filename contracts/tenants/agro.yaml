# FleetPulse - Catalogo del parque agricola (tenant `agro`). Misma forma que contracts/ids.yaml.
# IDs unicos entre parques: modelos TA/CS, zonas FUNDO-A/FUNDO-B/PACKING, tecnicos TEC-11..14, repuestos PRT-14..19.
# Ver docs/superpowers/plans/2026-11-15-multi-tenancy.md.
tenant_id: agro
operation: Fundo Valle Sur
timezone: America/Lima

zones:
  - {zone_id: FUNDO-A, name: "Fundo A - Vinedos", lat: -14.07, lon: -75.735, altitude_m: 410, weather_risk: dust}
  - {zone_id: FUNDO-B, name: "Fundo B - Esparragos", lat: -14.09, lon: -75.72, altitude_m: 395, weather_risk: dust}
  - {zone_id: PACKING, name: "Planta de empaque", lat: -14.08, lon: -75.705, altitude_m: 400, weather_risk: heat}

fuel_stations:
  - {station_id: EST-FUNDO-A, zone_id: FUNDO-A, lot: L-3101}
  - {station_id: EST-FUNDO-B, zone_id: FUNDO-B, lot: L-3102}
  - {station_id: EST-PACKING, zone_id: PACKING, lot: L-3103}

models:
  - {model_id: TA, name: "Tractor agricola", count: 8, service_interval_h: 250, fuel_lph_base: 14}
  - {model_id: CS, name: "Cosechadora", count: 4, service_interval_h: 250, fuel_lph_base: 30}

machines:
  - {machine_id: TA-001, model_id: TA, serial: AFCTA00121, zone_id: FUNDO-A, commissioned_at: '2021-09-15', hours_total: 13599, hours_since_service: 258}
