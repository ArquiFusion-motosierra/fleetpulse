  - {machine_id: TA-005, model_id: TA, serial: AFCTA00520, zone_id: FUNDO-B, commissioned_at: '2020-03-15', hours_total: 2285, hours_since_service: 295}
  - {machine_id: TA-006, model_id: TA, serial: AFCTA00624, zone_id: PACKING, commissioned_at: '2024-01-15', hours_total: 10555, hours_since_service: 222}
  - {machine_id: TA-007, model_id: TA, serial: AFCTA00721, zone_id: FUNDO-A, commissioned_at: '2021-03-15', hours_total: 11009, hours_since_service: 27}
  - {machine_id: TA-008, model_id: TA, serial: AFCTA00824, zone_id: FUNDO-B, commissioned_at: '2024-09-15', hours_total: 1834, hours_since_service: 50}
  - {machine_id: CS-001, model_id: CS, serial: AFCCS00118, zone_id: FUNDO-A, commissioned_at: '2018-04-15', hours_total: 4763, hours_since_service: 327}
  - {machine_id: CS-002, model_id: CS, serial: AFCCS00218, zone_id: FUNDO-B, commissioned_at: '2018-08-15', hours_total: 6145, hours_since_service: 245}
  - {machine_id: CS-003, model_id: CS, serial: AFCCS00322, zone_id: PACKING, commissioned_at: '2022-04-15', hours_total: 9305, hours_since_service: 139}
  - {machine_id: CS-004, model_id: CS, serial: AFCCS00423, zone_id: FUNDO-A, commissioned_at: '2023-05-15', hours_total: 8988, hours_since_service: 22}

technicians:
  - {tech_id: TEC-11, name: "Milagros Yupanqui", specialty: hydraulics, zone_id: FUNDO-A}
  - {tech_id: TEC-12, name: "Raul Huaraca", specialty: engine, zone_id: FUNDO-B}
  - {tech_id: TEC-13, name: "Elena Pariona", specialty: transmission, zone_id: FUNDO-A}
  - {tech_id: TEC-14, name: "Victor Tasayco", specialty: electrical, zone_id: PACKING}

parts:
  - {part_id: PRT-01, sku: FLT-FUEL-01, name: "Filtro de combustible", unit_cost_usd: 45}
  - {part_id: PRT-02, sku: FLT-HYD-01, name: "Filtro hidraulico", unit_cost_usd: 60}
  - {part_id: PRT-04, sku: PUMP-HYD-01, name: "Bomba hidraulica", unit_cost_usd: 6800}
