  - {model_id: TA, part_id: PRT-02, qty: 1, replace_every_h: 500, failure_mode: hydraulic_contamination}
  - {model_id: TA, part_id: PRT-01, qty: 1, replace_every_h: 500, failure_mode: fuel_contamination}
  - {model_id: TA, part_id: PRT-19, qty: 1, replace_every_h: 5000, failure_mode: fuel_contamination}
  - {model_id: TA, part_id: PRT-15, qty: 1, replace_every_h: 8000, failure_mode: engine_overheat}
  - {model_id: TA, part_id: PRT-11, qty: 1, replace_every_h: 250, failure_mode: engine_overheat}
  - {model_id: TA, part_id: PRT-14, qty: 1, replace_every_h: 7000, failure_mode: final_drive}
  - {model_id: CS, part_id: PRT-17, qty: 2, replace_every_h: 3000, failure_mode: final_drive}
  - {model_id: CS, part_id: PRT-16, qty: 1, replace_every_h: 1500, failure_mode: final_drive}
  - {model_id: CS, part_id: PRT-11, qty: 1, replace_every_h: 250, failure_mode: engine_overheat}
  - {model_id: CS, part_id: PRT-15, qty: 1, replace_every_h: 8000, failure_mode: engine_overheat}
  - {model_id: CS, part_id: PRT-01, qty: 1, replace_every_h: 500, failure_mode: fuel_contamination}
  - {model_id: CS, part_id: PRT-02, qty: 1, replace_every_h: 500, failure_mode: hydraulic_contamination}

# Stock inicial: mismo on_hand en las 3 zonas del parque, reserved = 0.
part_stock:
  - {part_id: PRT-01, on_hand_per_zone: 8, reorder_point: 3}
  - {part_id: PRT-02, on_hand_per_zone: 6, reorder_point: 2}
  # PRT-04 (bomba de mineria) en stock de agro: demo de transferencia entre parques (plan de repuestos, T37+)
  - {part_id: PRT-04, on_hand_per_zone: 3, reorder_point: 1}
  - {part_id: PRT-11, on_hand_per_zone: 8, reorder_point: 3}
  - {part_id: PRT-14, on_hand_per_zone: 1, reorder_point: 1}
  - {part_id: PRT-15, on_hand_per_zone: 1, reorder_point: 1}
  - {part_id: PRT-16, on_hand_per_zone: 2, reorder_point: 1}
  - {part_id: PRT-17, on_hand_per_zone: 2, reorder_point: 1}
  - {part_id: PRT-18, on_hand_per_zone: 1, reorder_point: 1}
  - {part_id: PRT-19, on_hand_per_zone: 3, reorder_point: 1}
